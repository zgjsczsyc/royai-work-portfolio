<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f4f2ec"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>住宅空间 · 3D 演示</title></head><body>
<div id="app">
<header><a class="brand" href="/" aria-label="回到首页"><span class="brand-mark">a₂</span><span>我们的家<small>A HOME FOR EVERYDAY</small></span></a><div class="header-center">住宅空间交互演示 <i></i> A2 · 123 m²</div><button id="photos" class="quiet">◫ 户型示意</button><button id="about" class="quiet">方案说明 ↗</button></header>
<nav id="room-nav" aria-label="空间选择"></nav>
<main><section id="viewport" aria-label="可交互三维房屋"><div id="canvas-host"></div><div class="scene-heading"><div class="eyebrow">YOUR NEXT CHAPTER</div><h1 id="view-title">把日子，安放在这里。</h1><p id="view-subtitle">浅木、暖光，和一家人的日常。</p></div><div id="labels"></div><div class="view-tools"><button id="reset" title="恢复视角">↺<span>还原</span></button><button id="top" title="俯视">⌑<span>俯视</span></button><button id="walls" aria-pressed="false">▥<span>完整墙体</span></button><button id="plan">▧<span>平面图</span></button><button id="interior">◎<span>室内视角</span></button><button id="focus">⛶<span>专心看房</span></button></div><div class="scene-bottom"><span class="status-dot"></span><span id="scene-status">概念设计 · 尺寸可校准</span><span class="gesture-hint">拖动旋转 · 滚轮缩放 · 右键平移</span></div><div id="loading">正在布置我们的家…</div></section>
<aside id="design-panel"><div class="panel-top"><span class="eyebrow">OPEN LIVING / 02</span><button id="close-panel" aria-label="收起面板">×</button></div><h2 id="detail-title">让空间，跟着生活变。</h2><p id="detail-note">客厅、书房、阳台连成横厅。双人桌放在沙发后，窗边留下隐藏客床和活动空间。</p>
<div class="mode-switch" aria-label="生活场景"><button data-mode="daily" class="selected">日常</button><button data-mode="work">专注</button><button data-mode="guest">留宿</button></div>
<div class="control-list"><button id="bed" class="control"><span class="control-icon">▱</span><span><strong>窗边隐藏客床</strong><small>1.2 × 2.0 m · 收起活动垫后展开</small></span><span class="switch" data-on="false"></span></button><button id="computer" class="control"><span class="control-icon">▣</span><span><strong>双人工作台</strong><small>坐在沙发后，面向客厅</small></span><span class="switch" data-on="true"></span></button><button id="lamp" class="control"><span class="control-icon">☼</span><span><strong>室内灯光</strong><small>暖色灯带与工作台灯</small></span><span class="switch" data-on="true"></span></button><button id="wardrobe" class="control"><span class="control-icon">▯</span><span><strong>主卧 L 型更衣柜</strong><small>移开柜门，查看内部收纳</small></span><span class="switch" data-on="false"></span></button></div>
<div class="small-title">电视，跟着人走 <span>可移动支架</span></div><div class="tv-places"><button data-tv="living" class="selected">客厅</button><button data-tv="dining">餐区</button><button data-tv="study">书房边</button><button id="tv-power" aria-pressed="true">⏻</button></div>
<div class="material-card"><div class="swatches"><i class="wood"></i><i class="stone"></i><i class="green"></i><i class="marble"></i></div><div><strong>延续精装，好好生活</strong><small>暖灰橡木 · 米白织物 · 岩板 · 柔和木色</small></div></div>
<div class="panel-foot"><span>● 洗烘位置保留在次卧外阳台</span><span>○ 设备平台独立于住宅室内</span></div></aside></main>
<footer><div class="time-heading"><span id="time-icon">☀</span><div><strong id="time-name">午后</strong><small>家的光影</small></div></div><input id="time" aria-label="时间" type="range" min="6" max="23" value="14" step=".25"><output id="time-value">14:00</output><div class="weather"><button data-weather="sun" class="selected" title="晴天">☀</button><button data-weather="cloud" title="阴天">☁</button><button data-weather="rain" title="雨天">☂</button></div><span class="daylight-note">氛围光影示意</span><button id="mobile-panel" aria-expanded="false" aria-controls="design-panel">调整方案</button></footer>
</div><dialog id="modal"><button id="modal-close" aria-label="关闭">×</button><div id="modal-body"></div></dialog><div id="toast" role="status"></div>
<script type="module" src="/src/main.js"></script></body></html>
