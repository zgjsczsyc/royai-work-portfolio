              if not isinstance(data.get('flowRulse'), str) or not data['flowRulse'].strip():
                  raise ValueError('缺少审批规则')
              fields = process_field_list(data.get('fieldList', []))
              rules = data.get('flowFileRulse')
              if not isinstance(rules, dict) or not rules.get('instructions') or not isinstance(rules.get('required_files'), list):
                  raise ValueError('缺少有效附件规则')
              return {'flowRulse': data['flowRulse'], 'processedFields': {'fields': fields},
                      'fileRulse': json.dumps(rules, ensure_ascii=False)}


          def process_field_list(rows):
              fields, labels, paths = [], set(), set()
              for row in rows:
                  label, path = row.get('cnField'), row.get('enField')
                  kind = row.get('valueType', 'text')
                  if not label or not path or label in labels or path in paths:
                      raise ValueError('字段映射缺项或重复')
                  if kind not in ('text', 'number', 'datetime_ms', 'json') or not isinstance(row.get('required', True), bool):
                      raise ValueError('字段类型配置错误')
                  fields.append({'label': label, 'path': path, 'kind': kind, 'required': row.get('required', True)})
                  labels.add(label)
                  paths.add(path)
              if not fields:
                  raise ValueError('字段映射为空')
              return fields
