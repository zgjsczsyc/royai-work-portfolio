    - data:
        code: |
          def main(workflow_data: str, processed_fields: dict, file_rules: str) -> dict:
              import json
              payload = json.loads(workflow_data)
              if not isinstance(payload, dict) or payload.get('success') is not True:
                  raise ValueError('OA 查询失败')
              body = payload.get('data') or {}
              return prepare(body.get('formData'), body.get('attachments', []), processed_fields, file_rules)

          def prepare(form, attachments, processed_fields, file_rules):
              import json
              from datetime import datetime, timezone, timedelta
              from decimal import Decimal, InvalidOperation

              if not isinstance(form, dict) or not form:
                  raise ValueError('表单为空或格式错误')
              fields = processed_fields.get('fields')
              if not fields:
                  raise ValueError('缺少字段配置，停止生成建议')

              def lookup(path):
                  if path in form:
                      value = form[path]
                  else:
                      value = form
                      for key in path.split('.'):
                          if isinstance(value, dict) and 'value' in value and key not in value:
                              value = value['value']
                          if not isinstance(value, dict) or key not in value:
                              return None
                          value = value[key]
                  while isinstance(value, dict) and ('value' in value or 'fdName' in value):
                      value = value['fdName'] if 'fdName' in value else value['value']
                  return value

              result = {}
              for field in fields:
                  value = lookup(field['path'])
                  if value is None or value == '' or value == [] or value == {}:
                      if field['required']:
                          raise ValueError('必需字段缺失：' + field['label'])
                      result[field['label']] = '未提供'
                      continue
                  if field['kind'] == 'datetime_ms':
                      if isinstance(value, bool) or not isinstance(value, (int, float)):
                          raise ValueError('日期字段必须为毫秒时间戳')
                      value = datetime.fromtimestamp(value / 1000, timezone(timedelta(hours=8))).isoformat(timespec='minutes')
                  elif field['kind'] == 'number':
                      try:
                          numeric = Decimal(str(value))
                          if not numeric.is_finite():
                              raise ValueError('数值必须有限')
                      except (InvalidOperation, ValueError):
                          raise ValueError('数值字段无效：' + field['label'])
                  result[field['label']] = value

              # 示例采购场景：确定性核对金额，模型只解释结果。
              if 'detail_items' in form:
                  total = Decimal('0')
                  try:
                      items = lookup('detail_items')
                      if not isinstance(items, list) or not items:
                          raise ValueError('采购明细为空')
                      for item in items:
                          qty, price, subtotal = (Decimal(str(item[k])) for k in ('qty', 'price', 'subtotal'))
                          if any(not v.is_finite() or v < 0 for v in (qty, price, subtotal)):
                              raise ValueError('采购明细存在无效金额或数量')
                          if qty * price != subtotal:
                              raise ValueError('采购明细单价乘数量与小计不一致')
                          total += subtotal
                      requested = Decimal(str(lookup('total_amount')))
                      if not requested.is_finite() or total != requested:
                          raise ValueError('采购明细合计与申请总额不一致')
                  except (KeyError, TypeError, InvalidOperation):
                      raise ValueError('采购明细字段无效')
                  result['金额核对'] = '单价×数量、小计与总额一致（代码核对）'

              rules = json.loads(file_rules)
              if not isinstance(rules, dict) or not isinstance(rules.get('required_files'), list) or not rules.get('instructions'):
                  raise ValueError('附件规则格式错误')
              if not isinstance(attachments, list) or any(not isinstance(a, dict) for a in attachments):
                  raise ValueError('附件列表格式错误')
              required = set(rules['required_files'])
              names = {a.get('name') for a in attachments}
              if required - names:
                  raise ValueError('缺少必需附件：' + '、'.join(sorted(required - names)))

              file_results, errors = [], []
              for att in attachments:
                  name = str(att.get('name') or '未命名附件')
                  try:
                      parsed = {'ATT-001': {'summary': '请假审批单扫描件，内容与系统填写一致', 'keyPoints': ['请假类型：年假', '请假天数：2天', '申请人签字齐全']},
           'ATT-002': {'summary': '采购报价明细表，共2行明细',
                       'keyPoints': ['GPU服务器 2台 单价85000 小计170000',
                                     '万兆交换机 4台 单价6500 小计26000',
                                     '明细合计196000，与申请总额一致']}}
                      content = parsed.get(att.get('id'))
                      if not isinstance(content, dict):
                          raise ValueError('演示附件不存在')
                      body = {'result': dict(content, received_instructions=rules['instructions'], simulated=True)}
                      file_results.append({'name': name, 'status': 'success', 'content': body['result']})
                  except (ValueError, KeyError):
                      if name in required:
                          raise ValueError('必需附件解析失败：' + name)
                      errors.append(name)
                      file_results.append({'name': name, 'status': 'failed', 'content': '内容不可用，不得推断附件结论'})
              return {
                  'process_data': json.dumps(result, ensure_ascii=False),
                  'file_data': json.dumps({'instructions': rules['instructions'], 'files': file_results,
                                           'incomplete': bool(errors), 'note': '存在解析失败附件，仅可列出已知事实及待核实项' if errors else '仅依据已提供材料'}, ensure_ascii=False),
                  'err_msg': '；'.join('附件解析失败：' + name for name in errors),
              }
        code_language: python3
        desc: 保留字段、日期、金额与附件完整性校验；附件为固定演示内容，没有真实 OCR 或外部请求。
