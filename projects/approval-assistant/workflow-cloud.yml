                                  'fd_leaveType': '年假',
                                  'fd_startDate': 1793840400000,
                                  'fd_endDate': 1793959200000,
                                  'fd_days': '2',
                                  'fd_reason': '年假休假，陪伴家人出行'},
                     'attachments': [{'id': 'ATT-001', 'name': '请假审批单.pdf'}]}}
              data = forms.get(workflow_id)
              return {'body': json.dumps({'success': data is not None, 'data': data}, ensure_ascii=False)}
