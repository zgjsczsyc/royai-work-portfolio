    - data:
        code: |
          def main(fdId: str, base_url: str) -> dict:
              """生成 HS256 JWT 并调用 BPM 数据接口，返回表单动态属性与附件列表。
              设计点：JWT 用标准库手写签名（hmac/base64），不依赖 PyJWT，规避沙箱依赖问题；
              nbf/iat=当前时间，exp=+30min，与服务端约定一致。"""
              import base64
              import hashlib
              import hmac
              import json
              import time
              import requests

              BASE = base_url.rstrip("/")
              JWT_KEY = "DEMO-KEY-0001"      # 生产版从凭据管理/环境变量读取，切勿硬编码
              JWT_SECRET = "demo-jwt-secret"
              JWT_TTL_MINUTES = 30

              def _b64url(raw: bytes) -> str:
                  return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

              def make_jwt() -> str:
                  now = int(time.time())
                  head = _b64url(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
                  body = _b64url(json.dumps(
                      {"nbf": now, "iss": JWT_KEY, "exp": now + JWT_TTL_MINUTES * 60, "iat": now},
                      separators=(",", ":")).encode())
                  sig = hmac.new(JWT_SECRET.encode(), f"{head}.{body}".encode(), hashlib.sha256).digest()
                  return f"Bearer {head}.{body}.{_b64url(sig)}"

              try:
                  resp = requests.post(
                      f"{BASE}/bpm/openapi/km-review/main/open/load",
                      headers={"Authorization": make_jwt(), "Content-Type": "application/json"},
                      json={"fdId": fdId, "mechanisms": {"load": "*"}}, timeout=5)
                  resp.raise_for_status()
                  result = resp.json()
                  if not result.get("success", False):
                      raise ValueError("BPM 查询失败")
                  data = result.get("data") or {}
                  mechanisms = data.get("mechanisms") or {}
                  # 优先取 sys-xform 下的 dynamicProps，为空则退回根级别
                  dynamic_props = (mechanisms.get("sys-xform") or {}).get("dynamicProps") or data.get("dynamicProps") or {}
                  attachment = mechanisms.get("attachment") or []
                  return {"dynamicProps": dynamic_props, "attachment": attachment}
              except Exception as e:
                  raise ValueError("BPM 数据暂不可用") from e
