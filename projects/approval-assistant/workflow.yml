        code: |
          def main(workflow_id: str, answer: str, workflow_code: str, task_id: str, base_url: str) -> dict:
              """把 AI 审批总结写回 BPM（手写 HS256 JWT）。返回写回状态，由后续回复展示。"""
              import base64
              import hashlib
              import hmac
              import json
              import time
              import requests

              BASE = base_url.rstrip("/")
              JWT_KEY, JWT_SECRET = "DEMO-KEY-0001", "demo-jwt-secret"

              def _b64url(raw: bytes) -> str:
                  return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

              def make_jwt() -> str:
                  now = int(time.time())
                  head = _b64url(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
                  body = _b64url(json.dumps(
                      {"nbf": now, "iss": JWT_KEY, "exp": now + 1800, "iat": now},
                      separators=(",", ":")).encode())
                  sig = hmac.new(JWT_SECRET.encode(), f"{head}.{body}".encode(), hashlib.sha256).digest()
                  return f"Bearer {head}.{body}.{_b64url(sig)}"

              payload = {
                  "IS_BC_INFO": {"IFID": "", "UUID": ""},
                  "IT_DATA": {
                      "workflow_id": workflow_id,
                      "answer": answer,
                      "workflow_code": workflow_code,
                      "task_id": task_id or "",
                  },
              }
              try:
                  resp = requests.post(
                      f"{BASE}/bpm/webhook/summary",
                      headers={"Authorization": make_jwt(), "Content-Type": "application/json"},
                      json=payload, timeout=5)
                  resp.raise_for_status()
                  es = resp.json().get("ES_BC_INFO") or {}
                  return {"result": "模拟 BPM 写回成功（仅保存本次服务内存，不代表审批通过或节点唤醒）。" if es.get("TYPE") == "S" else "模拟 BPM 写回失败，请人工处理；上述摘要仍可查看。"}
              except Exception as e:
                  return {"result": "模拟 BPM 写回失败，请人工处理；上述摘要仍可查看。"}
